<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>多成员增量发布验证台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#deebf4;font:14px system-ui,sans-serif}header{padding:14px 20px;background:#182532;border-bottom:1px solid #304151;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}small,.muted{color:#91a8ba}button,select{background:#253b4b;color:#edf8ff;border:1px solid #426176;border-radius:6px;padding:9px 12px;cursor:pointer}button:hover{background:#33546a}button:disabled{opacity:.4;cursor:default}main{padding:16px;max-width:1440px;margin:auto}.card{border:1px solid #314657;border-radius:10px;padding:16px;background:#182532;margin-bottom:12px}.grid{display:grid;grid-template-columns:minmax(320px,1fr) 260px;gap:12px}canvas{display:block;width:100%;height:520px;background:#14252c;border:1px solid #35525e;border-radius:8px;touch-action:none}aside{padding:14px;border:1px solid #314657;border-radius:8px}p{line-height:1.7}.bar{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.value{white-space:pre-wrap;word-break:break-word;line-height:1.8}.error{color:#ffba95;min-height:22px}iframe{width:100%;height:890px;border:1px solid #35525e;border-radius:9px;background:#101923}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}a{color:#85d4ec}#pairTitle{margin-bottom:12px}.badge{background:#223f43;border-radius:4px;padding:4px 7px;color:#9fe1c4}@media(max-width:800px){.grid{grid-template-columns:1fr}canvas{height:400px}.pair{grid-template-columns:1fr}main{padding:8px}aside{font-size:13px}}
</style>
<header><h1>多成员增量发布验证台</h1><span id="version" class="badge">SDK</span><span id="identity" class="muted"></span><span id="phase"></span></header>
<main>
<section id="launcher" class="card" hidden><p>创建一个共享房间，让两个成员分别进入。并排页面各自接收本人状态，共用同一份 NPC、掉落和地图。</p><div class="bar"><select id="scenario"></select><button id="create">创建多成员房间</button><button id="closeRoom" hidden>关闭整局</button></div><div id="links" class="value"></div></section>
<section id="pairTitle" hidden class="muted">两个页面保持可见即可共同就绪；点选其中一个页面后，用 WASD 移动。各成员的费用和结算独立。</section><section id="pair" class="pair"></section>
<section id="game" hidden><div class="grid"><div><canvas id="map" aria-label="等距共享地图"></canvas><div class="bar"><button id="attack">普攻</button><button id="cast">方向技能</button><button id="selfCast">自身技能</button><button id="cancel">取消准备</button><button id="pickup">拾取最近掉落</button></div><div class="bar"><button id="toExit">前往撤离点</button><button id="extract">开始撤离</button><button id="stop">停止</button><button id="leave">本人成员离场</button><button id="resetCache">重建显示缓存</button><button id="reconnect">重新连接</button></div><small>WASD 控制屏幕方向，点击地图导航。方向技能朝最近的存活 NPC；位置、命中、掉落和结算均来自 Rust。</small></div><aside><div id="own" class="value"></div><hr><div id="members" class="value"></div><hr><div id="inventory" class="value"></div><hr><div id="ledger" class="value"></div></aside></div></section>
<div id="problem" class="error"></div>
<p id="replicationStats"></p></main><script type="module" src="/delta.js"></script></html>
