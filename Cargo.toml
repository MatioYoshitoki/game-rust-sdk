[package]
name = "match-kernel"
version = "0.185.1"
edition = "2024"
description = "Authoritative match runtime SDK with versioned gameplay and asset contracts"
license = "MIT OR Apache-2.0"
publish = false
readme = "SDK.md"
autobins = false
autoexamples = false
include = ["Cargo.toml", "Cargo.lock", "SDK.md", "build.rs", "src/**/*.rs"]

[features]
replay = []

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "kernel-host"
path = "src/bin/kernel-host.rs"

