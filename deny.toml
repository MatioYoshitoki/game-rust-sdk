# cargo-deny 最小配置：供应链审计（RustSec 告警 + 许可证白名单 + 依赖重复检查）。
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# 0.185.0 锁定树实际遇到的许可集（unicode-ident 的 AND 表达式要求 Unicode-3.0）。
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "CC0-1.0", "Unicode-3.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
